# Pre-commit gate: formatting + lint on staged Python, shared via the repo.
# Enable once per clone with:  venv/bin/pre-commit install
#
# All hooks call the repo's pinned venv tools (language: system) so the exact
# same versions and pyproject.toml config apply here, in your editor, and in CI -
# and so pylint runs inside the venv where torch resolves. pylint finds the flat
# src/ modules via the init-hook in pyproject.toml.
repos:
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: venv/bin/isort
        language: system
        types: [python]

      - id: black
        name: black
        entry: venv/bin/black
        language: system
        types: [python]

      - id: pylint
        name: pylint
        entry: venv/bin/pylint
        language: system
        types: [python]
        require_serial: true
